# ============================================================
# Render.com Blueprint 配置
# 用途：在 Render 平台一键创建 MySQL 数据库 + Node.js 后端服务
# 使用方法：
#   1. 访问 https://dashboard.render.com/blueprints
#   2. 点击 "New Blueprint Instance"
#   3. 选择你的 GitHub 仓库
#   4. 选择分支（如 main），YAML 路径填写 render.yaml
#   5. 点击 "Apply"，等待约 3-5 分钟部署完成
#   6. 部署完成后，进入服务详情页，复制 "Service URL"（如 https://student-mgmt-api.onrender.com）
# ============================================================

services:
  - type: web
    name: student-mgmt-api
    runtime: node
    rootDir: server
    plan: free                   # 免费额度：512MB RAM，每月 750 小时；正式使用建议升级到 starter($7/月)
    region: oregon               # 可选：oregon / frankfurt / singapore / ohio / virginia
    buildCommand: |
      npm run prisma:generate
      npm run build
      npx prisma db push --accept-data-loss
      echo "===== 数据库初始化完成，开始种子数据 ====="
      npm run seed || echo "===== seed 可能已执行，跳过 ====="
    startCommand: node -r tsconfig-paths/register dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    # 环境变量：Render 管理面板中可随时修改，修改后自动重启
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"            # Render 要求固定监听 10000 端口
      - key: ENABLE_SWAGGER
        value: "false"
      # ===== 以下密钥强烈建议在 Render 管理面板手动覆盖（不要写死在 YAML）=====
      - key: JWT_SECRET
        generateValue: true      # 让 Render 自动生成随机密钥
      - key: JWT_ACCESS_EXPIRES
        value: 2h
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: STORAGE_TYPE
        value: local
      - key: UPLOAD_DIR
        value: uploads
      # ===== CORS：允许 Netlify 前端域名 =====
      # 部署完 Netlify 后，把域名填到这里，多域名用英文逗号分隔
      # 例如：https://your-student-site.netlify.app,https://your-admin-site.netlify.app
      - key: CORS_ORIGIN
        value: ""                 # 必填！先占位，等 Netlify 部署后回来填
      # ===== WebSocket 公网地址 =====
      # 填 Render 后端的 Service URL（不带 /api），例如 https://student-mgmt-api.onrender.com
      - key: WS_PUBLIC_URL
        sync: false               # 先不填，等服务启动后获得 URL 再填
      # ===== 中文字体（PDF 导出使用）=====
      - key: CHINESE_FONT_PATH
        value: ""                 # Render 环境自带 DejaVu 字体但不支持中文，留空会自动尝试系统字体
      # ===== Public Base URL（Swagger 用，可不填）=====
      - key: PUBLIC_BASE_URL
        sync: false
      # ===== DATABASE_URL：从下方的 MySQL 服务自动注入 =====
      - key: DATABASE_URL
        fromDatabase:
          name: student-mgmt-mysql
          property: connectionString

databases:
  - name: student-mgmt-mysql
    databaseName: student_mgmt
    user: student_app
    plan: free                   # 免费额度：256MB RAM，1GB 存储；正式使用建议升级
    region: oregon               # 与上面的服务 region 保持一致，否则跨区延迟高
    mysqlVersion: "8"
    # IP Allow List：如果需要本地连接数据库，添加你的公网 IP
    # ipAllowList:
    #   - source: 1.2.3.4/32
    #     description: 本地开发机
