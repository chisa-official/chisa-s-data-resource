# ============================================================
# 高校学生管理系统 - Nginx 配置模板
# ============================================================
#
# 部署步骤：
#   1. 复制本文件到 Nginx 配置目录
#      Ubuntu/Debian: /etc/nginx/sites-available/student-mgmt.conf
#      CentOS/RHEL:   /etc/nginx/conf.d/student-mgmt.conf
#   2. 替换 <SERVER_IP>、<DOMAIN>、<PROJECT_ROOT> 占位符
#   3. 建立软链并测试：
#      ln -s /etc/nginx/sites-available/student-mgmt.conf /etc/nginx/sites-enabled/
#      nginx -t
#      systemctl reload nginx
#
# 端口规划：
#   80   HTTP 入口（学生端 + 后台端 + API + WebSocket）
#   443  HTTPS 入口（预留，证书就绪后取消注释）
#   3000 后端 Node 服务（仅本机访问，不对外暴露）
#   3306 MySQL（仅本机访问，不对外暴露）
# ============================================================

# 后端上游
upstream student_mgmt_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 请求体大小限制（与后端 express.json limit 一致，文件上传另走 /api/shared/files）
client_max_body_size 20m;

# gzip 压缩
gzip on;
gzip_min_length 1k;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
gzip_vary on;
gzip_disable "msie6";

# ------------------------------------------------------------
# HTTP 主入口（80 端口）
# ------------------------------------------------------------
server {
    listen 80;
    # server_name <DOMAIN> _;     # 有域名时填 <DOMAIN>，无域名用 _ 匹配 IP
    server_name _;

    # 访问日志
    access_log /var/log/nginx/student-mgmt.access.log;
    error_log  /var/log/nginx/student-mgmt.error.log warn;

    # 项目根目录（绝对路径，替换 <PROJECT_ROOT>）
    # set $project_root <PROJECT_ROOT>;
    set $project_root /opt/student-mgmt;

    # --------------------------------------------------------
    # 1. 后端 API 反向代理
    # --------------------------------------------------------
    location /api/ {
        proxy_pass http://student_mgmt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # API 超时（导出大文件、PDF 生成可能较慢）
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # --------------------------------------------------------
    # 2. WebSocket 代理（socket.io）
    # --------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://student_mgmt_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 长连接超时
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------
    # 3. Swagger 文档（生产环境可选，建议关闭）
    # --------------------------------------------------------
    location /api-docs {
        proxy_pass http://student_mgmt_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 生产环境如需禁用，可改为 return 404;
    }

    # --------------------------------------------------------
    # 4. 上传文件静态访问
    # --------------------------------------------------------
    location /uploads/ {
        alias $project_root/server/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # 防止执行上传目录中的脚本
        location ~ \.(php|jsp|py|sh|cgi)$ {
            deny all;
        }
    }

    # --------------------------------------------------------
    # 5. 后台管理端（/admin 前缀）
    #    访问地址：http://<SERVER_IP>/admin
    # --------------------------------------------------------
    location /admin/ {
        alias $project_root/admin-web/dist/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        # 静态资源长缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        # HTML 不缓存，确保发布即时生效
        location = /admin/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # --------------------------------------------------------
    # 6. 学生端（根路径）
    #    访问地址：http://<SERVER_IP>/
    # --------------------------------------------------------
    location / {
        root $project_root/student-web/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        # 静态资源长缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
        # HTML 不缓存
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # --------------------------------------------------------
    # 7. 健康检查端点
    # --------------------------------------------------------
    location = /healthz {
        proxy_pass http://student_mgmt_backend/api/health;
        access_log off;
    }

    # 安全头（后端 helmet 已处理部分，此处补充静态资源安全策略）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

